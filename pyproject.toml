[project]
name = "azure-vm-sdk"
version = "0.1.0"
description = "Python SDK for managing Azure VMs via OpenTofu"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
azure-vm-quality = "azure_vm.devtools.quality:main"
azure-vm-package-report = "azure_vm.devtools.package_report:main"
azure-vm-eval = "azure_vm.devtools.code_eval:main"
azure-vm-e2e = "azure_vm.e2e:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "basedpyright>=1.39.3",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pydeps>=3.0.6",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_vm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require Azure + OpenTofu installed)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "SLF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841", "SLF001"]

[tool.basedpyright]
include = [
    "src",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
